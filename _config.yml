# إعداد GitHub Pages: يُنشر الموقع الثابت فقط (صفحات HTML + css + js + images + data/site.json).
# ملفات PHP ولوحة التحكم تعمل محليًا على XAMPP فقط ولا تُنشر، لأن GitHub Pages لا يشغّل PHP.
exclude:
  - "*.php"
  - "*.sql"
  - "*.txt"
  - "*.bat"
  - admin
  - includes
  - tools
  - "data/*.tmp"

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة - روح ينبع</title>
    <meta name="robots" content="noindex">
    <script>
        // الروابط القديمة بصيغة PHP (مثل details.php?id=3) تُحوَّل لنفس الصفحة في النسخة الثابتة
        (function () {
            var match = location.pathname.match(/^(.*\/)(index|places|details|categories|destination|trip|about|contact)\.php$/);
            if (match) location.replace(match[1] + match[2] + '.html' + location.search + location.hash);
        })();
    </script>
    <style>
        body{font-family:'Cairo',Tahoma,sans-serif;background:#f3f6fa;color:#0f2340;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:20px}
        main{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:40px 32px;max-width:480px}
        h1{font-size:26px;margin:0 0 10px}
        p{color:#62738a;margin:0 0 24px}
        a{display:inline-block;background:#1f5fa8;color:#fff;padding:11px 26px;border-radius:999px;text-decoration:none;font-weight:700}
    </style>
</head>
<body>
    <main>
        <h1>الصفحة غير موجودة</h1>
        <p>ربما تم نقل الصفحة أو أن الرابط غير صحيح.</p>
        <a id="home-link" href="/ynbb/">العودة للرئيسية</a>
    </main>
    <script>
        // رابط الرئيسية يعمل سواء نُشر الموقع في /ynbb/ أو في جذر النطاق
        if (!/^\/ynbb(\/|$)/.test(location.pathname)) document.getElementById('home-link').href = '/';
    </script>
</body>
</html>
